name: Game Daily (WeChat game media)

on:
  # 매일 UTC 03:13 = 한국 12:13 / 중국 11:13 — 당일 게시글이 올라온 뒤 실행 (로이 지시: 12시 기준).
  # ⚠️ 정각(03:00)은 전 세계 예약작업이 몰리는 시간대라 GitHub 크론이 밀리거나 누락된다
  #    (2026-10-01 실측: 03:00 예약이 아예 실행 안 됨). 13분으로 비껴 스케줄한다.
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Connectivity check (China sources)
        run: |
          echo "--- gamelook.com.cn (1순위) ---"
          curl -s -o /dev/null -m 20 -w "%{http_code} %{time_total}s\n" http://www.gamelook.com.cn/ || echo "UNREACHABLE"
          echo "--- news.yxrb.net (2순위) ---"
          curl -s -o /dev/null -m 20 -w "%{http_code} %{time_total}s\n" http://news.yxrb.net/ || echo "UNREACHABLE"
          echo "--- sogou ---"
          curl -s -o /dev/null -m 20 -w "%{http_code} %{time_total}s\n" "https://weixin.sogou.com/weixin?type=1&query=test" || echo "UNREACHABLE"

      - name: Create config.json (from secrets)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GA4_ID: ${{ secrets.GA4_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          AFFILIATES_JSON: ${{ secrets.AFFILIATES_JSON }}
        run: |
          python - <<'PY'
          import json, os
          glm = os.environ.get('GLM_API_KEY', '').strip()
          ds  = os.environ.get('DEEPSEEK_API_KEY', '').strip()
          free_keys = [os.environ.get(k, '').strip()
                       for k in ('GEMINI_API_KEY', 'GROQ_API_KEY', 'GROQ_API_KEY_2',
                                 'OPENROUTER_API_KEY', 'NVIDIA_API_KEY')]
          # 무료 API 만 등록해도 동작해야 한다(로이 2026-10-02) → 키 하나라도 있으면 진행
          if not (glm or ds or any(free_keys)):
              raise SystemExit('GLM/DeepSeek 또는 무료 API(GEMINI/GROQ/OPENROUTER/NVIDIA) '
                               '시크릿이 하나는 필요합니다')
          provider = 'glm' if glm else 'deepseek'
          ga4 = os.environ.get('GA4_ID', '').strip()
          gsc = os.environ.get('GOOGLE_SITE_VERIFICATION', '').strip()
          aff_raw = os.environ.get('AFFILIATES_JSON', '').strip()
          if aff_raw:
              try:
                  aff_cfg = json.loads(aff_raw)
                  aff_cfg.setdefault('enabled', True)
                  aff_cfg.setdefault('disclosure_path', 'disclosure.html')
                  aff_cfg['offers'] = [o for o in aff_cfg.get('offers', []) if (o.get('url') or '').strip()]
              except Exception as e:
                  print('AFFILIATES_JSON 파싱 실패:', e)
                  aff_cfg = {'enabled': False, 'offers': []}
          else:
              aff_cfg = {'enabled': False, 'offers': []}
          # 무료 제공자 — 키가 없으면 llm.py 가 자동으로 건너뛴다.
          # 우선순위: 무료(gemini/groq/openrouter/nvidia) → GLM → DeepSeek(유료 폴백)
          def free_sec(key, base, model):
              return {"api_key": (os.environ.get(key, '') or '').strip(),
                      "base_url": base, "model": model, "free": True}

          cfg = {
            "provider": provider,
            "gemini": free_sec('GEMINI_API_KEY',
                               'https://generativelanguage.googleapis.com/v1beta/openai',
                               'gemini-flash-latest'),
            "groq": free_sec('GROQ_API_KEY', 'https://api.groq.com/openai/v1',
                             'llama-3.3-70b-versatile'),
            "groq2": free_sec('GROQ_API_KEY_2', 'https://api.groq.com/openai/v1',
                              'llama-3.3-70b-versatile'),
            "openrouter": free_sec('OPENROUTER_API_KEY', 'https://openrouter.ai/api/v1',
                                   'openrouter/free'),
            "nvidia": free_sec('NVIDIA_API_KEY', 'https://integrate.api.nvidia.com/v1',
                               'nvidia/deepseek-v4-flash'),
            "write_provider_order": ["gemini", "groq", "groq2", "openrouter", "nvidia", "glm", "deepseek"],
            "check_provider_order": ["gemini", "groq", "groq2", "openrouter", "deepseek"],
            "glm": {
              "api_key": glm,
              "base_url": "https://open.bigmodel.cn/api/paas/v4",
              "model": "glm-5.3-flash"
            },
            "deepseek": {
              "api_key": ds,
              "base_url": "https://api.deepseek.com",
              # flash 전용 (로이 지시). 'deepseek-v4-flash' 는 없는 모델(404).
              "model": "deepseek-flash"
            },
            # 게임 수집 대상 언어.
            # 🔴 2026-10-10 로이 지시 "언어 축소" — bn(벵골어) · id(인도네시아어) 수집 중단.
            #   경제 파이프라인(auto-publish.yml)과 일관성을 맞춘다.
            #   ⚠️ 기존 발행분은 유지된다 (build.py LANG_META 는 13개 고정) → 404 없음.
            #   되돌리려면 다시 넣는다.
            "languages": {
              "zh": "Chinese (Mandarin)", "hi": "Hindi", "es": "Spanish",
              "ar": "Arabic", "fr": "French",
              "pt": "Portuguese", "ru": "Russian", "de": "German",
              "ja": "Japanese", "ko": "Korean"
            },
            "translate_languages": {
              "ko": "Korean", "zh": "Chinese (Mandarin)",
              "ja": "Japanese", "es": "Spanish"
            },
            "translate_exclude_prefixes": ["project-syndicate-"],
            "translate_workers": 5,
            "max_translations_per_run": 40,
            "char_min": 3000,
            "char_max": 5000,
            "max_new_posts_per_run": 1,
            "apps_per_lang_per_day": 1,
            "analytics": {"ga4_id": ga4, "google_site_verification": gsc},
            "affiliates": aff_cfg
          }
          json.dump(cfg, open('config.json', 'w'), ensure_ascii=False, indent=2)
          print('provider =', provider)
          PY

      - name: Run game daily radar (위챗 게임미디어 → 13개 언어 재각색)
        id: game_daily
        # 🔴 2026-10-11: 예전 `python scripts/game_daily.py || echo "..."` 는 return 1 을
        #   삼켜서 **6일간(10-02~10-07) 0건이면서 Actions 는 success 로 찍혔다.**
        #   이제 종료 코드로 구분한다 (0=발행성공, 3=새기사 0건, 그 외=진짜 오류).
        #   단, 아래 스텝이 exit 1 로 끝나도 빌드/커밋은 계속돼야 한다 —
        #   게임 1절이 안 되는다고 사이트 전체를 죽이면 안 된다.
        continue-on-error: true
        run: |
          set +e
          python scripts/game_daily.py
          code=$?
          set -e
          echo "::group::game_daily 종료 코드 = $code"
          echo "  0 = 발행 성공 / 이미 오늘 발행 완료"
          echo "  3 = 새 기사 0건 (소스에 당일 글이 없음 — 오류 아님)"
          echo "  1 = 진짜 오류 (네트워크/파싱/LLM 전체 실패)"
          echo "::endgroup::"
          if [ "$code" -eq 0 ]; then
            echo "game_daily: 정상 (발행 완료)"
          elif [ "$code" -eq 3 ]; then
            # 0건 — 경고로 표시하되 파이프라인은 계속한다.
            echo "::warning title=game_daily 0건::소스에 새 기사가 없어 오늘 발행 0건 (종료코드 3). 빌드는 정상 진행합니다. 위 로그의 '이미 발행한 기사 N건 건너뜀'을 확인하세요 — N>0 이면 중복 때문에 막힌 것입니다."
          else
            # 진짜 오류 — 이건 반드시 눈에 띄어야 한다.
            echo "::error title=game_daily 실패::game_daily.py 가 종료코드 $code 로 실패했습니다. 로그의 마지막 '선정:' 단계를 확인하세요."
          fi
          # 스텝 자체는 항상 0 으로 끝내어 빌드/커밋 스텝이 중단되지 않게 한다.
          # 진짜 실패는 위 ::error:: annotation 으로 surfaces 된다.
          exit 0

      - name: Build site
        run: python scripts/build.py

      - name: Commit and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "wndgns032-gif"
          git config user.email "279455992+wndgns032-gif@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: game daily $(date -u +%Y%m%d-%H%M)"
            git remote set-url origin https://x-access-token:${TOKEN}@github.com/wndgns032-gif/mycapitalanalyze.git
            git push origin main
          fi
