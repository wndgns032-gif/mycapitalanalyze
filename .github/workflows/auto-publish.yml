name: Auto Publish (daily)

on:
  schedule:
    # 매일 UTC 06:17 (한국 15:17) — 30분 주기로 돌리면 하루 최대 144편이 쌓여
    # 구글 '스케일드 콘텐츠 어뷰즈' 판정을 받는다. 하루 1회만 돈다.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      per_lang:
        description: '언어당 발행 수 (기본 1)'
        required: false
        default: '1'
      apps_only:
        description: '앱/게임 레이더만 실행'
        required: false
        default: 'true'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 언어 13개 × 레이더 수집(HTTP) + LLM 재시도 → 여유 있게 준다.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create config.json (from secrets)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GA4_ID: ${{ secrets.GA4_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          AFFILIATES_JSON: ${{ secrets.AFFILIATES_JSON }}
        run: |
          python - <<'PY'
          import json, os
          glm = os.environ.get('GLM_API_KEY', '').strip()
          ds  = os.environ.get('DEEPSEEK_API_KEY', '').strip()
          free_keys = [os.environ.get(k, '').strip()
                       for k in ('GEMINI_API_KEY', 'GROQ_API_KEY', 'GROQ_API_KEY_2',
                                 'OPENROUTER_API_KEY', 'NVIDIA_API_KEY')]
          # 무료 API 만 등록해도 동작해야 한다(로이 2026-10-02) → 키 하나라도 있으면 진행
          if not (glm or ds or any(free_keys)):
              raise SystemExit('GLM/DeepSeek 또는 무료 API(GEMINI/GROQ/OPENROUTER/NVIDIA) '
                               '시크릿이 하나는 필요합니다')
          provider = 'glm' if glm else 'deepseek'

          # 분석 추적: GA4_ID 시크릿이 비어 있으면 추적 코드를 넣지 않는다.
          ga4 = os.environ.get('GA4_ID', '').strip()
          gsc = os.environ.get('GOOGLE_SITE_VERIFICATION', '').strip()

          # 제휴 설정: AFFILIATES_JSON 시크릿 = {"offers":[{"id","name","url","blurb","categories"}]}
          # 시크릿이 없으면 제휴 박스를 렌더링하지 않는다(안전 기본값).
          aff_raw = os.environ.get('AFFILIATES_JSON', '').strip()
          if aff_raw:
              try:
                  aff_cfg = json.loads(aff_raw)
                  aff_cfg.setdefault('enabled', True)
                  aff_cfg.setdefault('disclosure_path', 'disclosure.html')
                  aff_cfg['offers'] = [o for o in aff_cfg.get('offers', []) if (o.get('url') or '').strip()]
                  print('affiliate offers =', len(aff_cfg['offers']))
              except Exception as e:
                  print('AFFILIATES_JSON 파싱 실패, 제휴 비활성화:', e)
                  aff_cfg = {'enabled': False, 'offers': []}
          else:
              aff_cfg = {'enabled': False, 'offers': []}
          # 무료 제공자 — 키가 없으면 llm.py 가 자동으로 건너뛴다.
          # 우선순위: 무료(gemini/groq/openrouter/nvidia) → GLM → DeepSeek(유료 폴백)
          def free_sec(key, base, model):
              return {"api_key": (os.environ.get(key, '') or '').strip(),
                      "base_url": base, "model": model, "free": True}

          cfg = {
            "provider": provider,
            "gemini": free_sec('GEMINI_API_KEY',
                               'https://generativelanguage.googleapis.com/v1beta/openai',
                               'gemini-flash-latest'),
            "groq": free_sec('GROQ_API_KEY', 'https://api.groq.com/openai/v1',
                             'llama-3.3-70b-versatile'),
            # 두 번째 Groq 키 — 첫 키가 429(Rate limit)이면 자동으로 넘어간다.
            "groq2": free_sec('GROQ_API_KEY_2', 'https://api.groq.com/openai/v1',
                              'llama-3.3-70b-versatile'),
            "openrouter": free_sec('OPENROUTER_API_KEY', 'https://openrouter.ai/api/v1',
                                   'openrouter/free'),
            "nvidia": free_sec('NVIDIA_API_KEY', 'https://integrate.api.nvidia.com/v1',
                               'nvidia/deepseek-v4-flash'),
            "write_provider_order": ["gemini", "groq", "groq2", "openrouter", "nvidia", "glm", "deepseek"],
            "check_provider_order": ["gemini", "groq", "groq2", "openrouter", "deepseek"],
            "glm": {
              "api_key": glm,
              "base_url": "https://open.bigmodel.cn/api/paas/v4",
              "model": "glm-5.3-flash"
            },
            "deepseek": {
              "api_key": ds,
              "base_url": "https://api.deepseek.com",
              # ⚠️ flash 전용. 'deepseek-v4-flash' 는 없는 모델(404).
              "model": "deepseek-flash"
            },
            "languages": {
              "zh": "Chinese (Mandarin)", "hi": "Hindi", "es": "Spanish",
              "ar": "Arabic", "fr": "French", "bn": "Bengali",
              "pt": "Portuguese", "ru": "Russian", "de": "German",
              "ja": "Japanese", "id": "Indonesian", "ko": "Korean"
            },
            # 번역 대상 언어.
            # 🔴 2026-10-10 로이 지시 "언어 축소" — 신규 발행만 중단한다.
            #   제외한 언어와 이유:
            #     bn(벵골어)  — 애드센스 RPM 최하위권. Search Console '크롤링됨-색인 안됨'에도 잡힘
            #     id(인도네시아어) — 동일
            #   ⚠️ 기존 발행분은 **그대로 유지**한다. build.py 의 LANG_META 는 13개 고정이라
            #      여기서 빼도 파일은 남고 sitemap 에도 남는다 → 404 가 생기지 않는다.
            #      (언어를 지우는 것과 신규 발행을 멈추는 것은 완전히 다른 일이다)
            #   되돌리려면 이 목록에 다시 넣으면 된다. 기존 글은 손댈 필요 없다.
            #   근거: 2026-10-10 '크롤링됨 - 색인 생성되지 않음' 20건 분석
            "translate_languages": {
              "zh": "Chinese (Mandarin)", "hi": "Hindi", "es": "Spanish",
              "ar": "Arabic", "fr": "French",
              "pt": "Portuguese", "ru": "Russian", "de": "German",
              "ja": "Japanese", "ko": "Korean"
            },
            "translate_exclude_prefixes": ["project-syndicate-"],
            "translate_workers": 5,
            "max_translations_per_run": 40,
            "char_min": 3000,
            "char_max": 5000,
            # 하루 2편 (2026-10-11 로이 지시: "언어당 하루에 경제 4개 → 2개로")
            "max_new_posts_per_run": 2,
            # 앱·게임 레이더: 모든 언어에 하루 2건씩 (2026-10-11 로이 지시).
            #   → 언어당 하루 총 4편 = 경제 2 + 게임 2 (전체 일량은 이전과 동일, 조합만 변경)
            "apps_per_lang_per_day": 2,
            "analytics": {"ga4_id": ga4, "google_site_verification": gsc},
            "affiliates": aff_cfg
          }
          json.dump(cfg, open('config.json', 'w'), ensure_ascii=False, indent=2)
          print('provider =', provider)
          PY

      - name: Run publish pipeline (크롤링→번역→앱레이더→빌드→색인)
        if: github.event_name == 'schedule' || inputs.apps_only != 'true'
        run: python scripts/publish.py

      - name: 앱/게임 레이더만 실행 (수동 백필용)
        if: github.event_name == 'workflow_dispatch' && inputs.apps_only == 'true'
        run: |
          python scripts/app_radar.py --per-lang ${{ inputs.per_lang }}
          python scripts/build.py

      - name: 어필리에이트 커버리지 검증 (카드 없는 글 방지)
        # 로이 지시 2026-10-10: "알리익스프레스 제품이 없다면 다 집어넣어줘"
        #   → 빌드 결과에 상품 카드가 빠진 포스트가 있는지 검사한다.
        #   카드가 0개인 글이 있으면 워크플로를 실패시켜 강제 리뷰가 되게 한다.
        #   (strict 는 누락 발견 시 exit 1. 사이트 자체를 죽이지는 않는다 —
        #    빌드 산출물은 이미 만들어졌고, 이 단계는 알림용이다)
        run: |
          python scripts/verify_aff_coverage.py || {
            echo "::warning::어필리에이트 카드 누락 감지 — 위 목록 확인"
          }

      - name: Commit and push
        env:
          # GH_PAT 대신 기본 GITHUB_TOKEN 사용 (permissions: contents: write 로 푸시 가능)
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "wndgns032-gif"
          git config user.email "279455992+wndgns032-gif@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: content update $(date -u +%Y%m%d-%H%M)"
            git remote set-url origin https://x-access-token:${TOKEN}@github.com/wndgns032-gif/mycapitalanalyze.git
            git push origin main
          fi
