name: Auto Publish (daily)

on:
  schedule:
    # 매일 UTC 06:17 (한국 15:17) — 30분 주기로 돌리면 하루 최대 144편이 쌓여
    # 구글 '스케일드 콘텐츠 어뷰즈' 판정을 받는다. 하루 1회만 돈다.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create config.json (from secrets)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json, os
          glm = os.environ.get('GLM_API_KEY', '').strip()
          ds  = os.environ.get('DEEPSEEK_API_KEY', '').strip()
          if not (glm or ds):
              raise SystemExit('GLM_API_KEY 또는 DEEPSEEK_API_KEY 시크릿이 필요합니다')
          provider = 'glm' if glm else 'deepseek'
          cfg = {
            "provider": provider,
            "glm": {
              "api_key": glm,
              "base_url": "https://open.bigmodel.cn/api/paas/v4",
              "model": "glm-5.3-flash"
            },
            "deepseek": {
              "api_key": ds,
              "base_url": "https://api.deepseek.com",
              "model": "deepseek-v4-flash"
            },
            "languages": {
              "zh": "Chinese (Mandarin)", "hi": "Hindi", "es": "Spanish",
              "ar": "Arabic", "fr": "French", "bn": "Bengali",
              "pt": "Portuguese", "ru": "Russian", "de": "German",
              "ja": "Japanese", "id": "Indonesian", "ko": "Korean"
            },
            "translate_languages": {
              "ko": "Korean", "zh": "Chinese (Mandarin)",
              "ja": "Japanese", "es": "Spanish"
            },
            "translate_exclude_prefixes": ["project-syndicate-"],
            "translate_workers": 5,
            "max_translations_per_run": 40,
            "char_min": 3000,
            "char_max": 5000,
            "max_new_posts_per_run": 1
          }
          json.dump(cfg, open('config.json', 'w'), ensure_ascii=False, indent=2)
          print('provider =', provider)
          PY

      - name: Run publish pipeline
        run: python scripts/publish.py

      - name: Commit and push
        env:
          # GH_PAT 대신 기본 GITHUB_TOKEN 사용 (permissions: contents: write 로 푸시 가능)
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "wndgns032-gif"
          git config user.email "279455992+wndgns032-gif@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: content update $(date -u +%Y%m%d-%H%M)"
            git remote set-url origin https://x-access-token:${TOKEN}@github.com/wndgns032-gif/mycapitalanalyze.git
            git push origin main
          fi
