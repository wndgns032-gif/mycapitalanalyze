name: Submit URLs to IndexNow

# 발행 워크플로(UTC 06:17)가 끝나고 Vercel에 배포될 시간을 준 뒤 실행한다.
# IndexNow 알림은 '이미 배포된' URL에 대해 보내야 한다 — 없는 URL을 알리면 품질 점수가 깎인다.
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
  # 발행 후 자동 체이닝
  workflow_run:
    workflows: ["Auto Publish (daily)"]
    types: [completed]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Submit new URLs to IndexNow (Bing / Naver / Yandex / Seznam / Yep)
        run: python scripts/submit_index.py

      - name: Commit index state
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "wndgns032-gif"
          git config user.email "279455992+wndgns032-gif@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "auto: indexnow submission state"
            git remote set-url origin https://x-access-token:${TOKEN}@github.com/wndgns032-gif/mycapitalanalyze.git
            git push origin main
          fi
